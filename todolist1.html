<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow - Modern Task Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f5ff',
                            100: '#e5edff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.7);
        }
        /* Glassmorphism effects */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass-card {
            background: rgba(31, 41, 55, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="h-full bg-gradient-to-br from-indigo-50 via-slate-100 to-purple-50 dark:from-gray-950 dark:via-slate-900 dark:to-indigo-950 text-gray-800 dark:text-gray-100 transition-colors duration-300">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <div class="min-h-full flex flex-col">
        <header class="glass-panel sticky top-0 z-30 border-b shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 p-2.5 rounded-xl shadow-lg shadow-indigo-500/30 text-white">
                        <i data-lucide="check-square" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-xl tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 dark:from-indigo-400 dark:to-violet-400 bg-clip-text text-transparent">TaskFlow</h1>
                        <p class="text-xs text-gray-500 dark:text-gray-400 font-medium">Smart Task Manager</p>
                    </div>
                </div>

                <!-- Theme Toggle & Quick Actions -->
                <div class="flex items-center gap-3">
                    <button id="theme-toggle" class="p-2.5 rounded-xl hover:bg-gray-200/60 dark:hover:bg-gray-800 transition-colors text-gray-600 dark:text-gray-300">
                        <i data-lucide="moon" id="theme-icon-dark" class="w-5 h-5 hidden"></i>
                        <i data-lucide="sun" id="theme-icon-light" class="w-5 h-5 hidden"></i>
                    </button>
                    <button onclick="openModal()" class="flex items-center gap-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-medium px-4 py-2.5 rounded-xl shadow-lg shadow-indigo-500/25 transition-all transform active:scale-95 text-sm">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">New Task</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

            <!-- Stats & Progress Bar -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="glass-panel p-5 rounded-2xl shadow-sm border flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Total Tasks</p>
                        <h3 id="stat-total" class="text-3xl font-extrabold mt-1">0</h3>
                    </div>
                    <div class="p-3 bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 rounded-xl">
                        <i data-lucide="layers" class="w-6 h-6"></i>
                    </div>
                </div>

                <div class="glass-panel p-5 rounded-2xl shadow-sm border flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Pending</p>
                        <h3 id="stat-pending" class="text-3xl font-extrabold mt-1 text-amber-600 dark:text-amber-400">0</h3>
                    </div>
                    <div class="p-3 bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 rounded-xl">
                        <i data-lucide="clock" class="w-6 h-6"></i>
                    </div>
                </div>

                <div class="glass-panel p-5 rounded-2xl shadow-sm border flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Completed</p>
                        <h3 id="stat-completed" class="text-3xl font-extrabold mt-1 text-emerald-600 dark:text-emerald-400">0</h3>
                    </div>
                    <div class="p-3 bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 rounded-xl">
                        <i data-lucide="check-circle-2" class="w-6 h-6"></i>
                    </div>
                </div>

                <!-- Productivity Progress Card -->
                <div class="glass-panel p-5 rounded-2xl shadow-sm border flex flex-col justify-between">
                    <div class="flex justify-between items-center">
                        <p class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Completion Rate</p>
                        <span id="stat-percent" class="text-xs font-bold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-3 mt-3 overflow-hidden">
                        <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-emerald-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="glass-panel p-4 rounded-2xl shadow-sm border space-y-4">
                <div class="flex flex-col lg:flex-row gap-4 justify-between items-stretch lg:items-center">
                    
                    <!-- Search Input -->
                    <div class="relative flex-1">
                        <i data-lucide="search" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="search-input" placeholder="Search tasks by title or description..." class="w-full pl-10 pr-4 py-2.5 bg-white/80 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition-all">
                    </div>

                    <!-- Filter Options Controls -->
                    <div class="flex flex-wrap items-center gap-2.5">
                        <!-- Status Filter -->
                        <select id="filter-status" class="bg-white/80 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="all">All Status</option>
                            <option value="active">Active Tasks</option>
                            <option value="completed">Completed</option>
                        </select>

                        <!-- Priority Filter -->
                        <select id="filter-priority" class="bg-white/80 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="all">All Priorities</option>
                            <option value="High">High Priority</option>
                            <option value="Medium">Medium Priority</option>
                            <option value="Low">Low Priority</option>
                        </select>

                        <!-- Category Filter -->
                        <select id="filter-category" class="bg-white/80 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="all">All Categories</option>
                            <option value="Work">Work</option>
                            <option value="Personal">Personal</option>
                            <option value="Fitness">Fitness</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Study">Study</option>
                            <option value="Ideas">Ideas</option>
                        </select>

                        <!-- Sort By -->
                        <select id="sort-by" class="bg-white/80 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-indigo-600 dark:text-indigo-400">
                            <option value="dueDate">Sort: Due Date</option>
                            <option value="priority">Sort: Priority</option>
                            <option value="created">Sort: Created Date</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="tasks-container" class="space-y-3">
                <!-- Task items dynamically rendered here -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden glass-panel rounded-2xl p-12 text-center border">
                <div class="w-16 h-16 bg-indigo-50 dark:bg-gray-800 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="clipboard-list" class="w-8 h-8"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-800 dark:text-gray-200">No tasks found</h3>
                <p class="text-gray-500 dark:text-gray-400 text-sm mt-1 max-w-sm mx-auto">Try adjusting your filters or click "New Task" to start organizing your workflow.</p>
                <button onclick="openModal()" class="mt-5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-xl text-sm transition-colors">
                    Add First Task
                </button>
            </div>
        </main>
    </div>

    <div id="task-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden p-4 overflow-y-auto">
        <div class="glass-panel bg-white dark:bg-gray-900 w-full max-w-xl rounded-2xl shadow-2xl border border-gray-100 dark:border-gray-800 my-8 transform transition-all overflow-hidden">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-800 flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-lg text-gray-800 dark:text-gray-100">Create New Task</h3>
                <button onclick="closeModal()" class="p-2 rounded-xl text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Modal Form -->
            <form id="task-form" class="p-6 space-y-4">
                <input type="hidden" id="task-id">
                
                <!-- Title -->
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Task Title *</label>
                    <input type="text" id="form-title" required placeholder="What needs to be done?" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Description</label>
                    <textarea id="form-desc" rows="3" placeholder="Add additional details or context..." class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none"></textarea>
                </div>

                <!-- Due Date & Priority Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Due Date & Time</label>
                        <input type="datetime-local" id="form-date" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Priority</label>
                        <select id="form-priority" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="Low">Low Priority</option>
                            <option value="Medium" selected>Medium Priority</option>
                            <option value="High">High Priority</option>
                        </select>
                    </div>
                </div>

                <!-- Category -->
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Category Tag</label>
                    <select id="form-category" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="Work">Work</option>
                        <option value="Personal">Personal</option>
                        <option value="Fitness">Fitness</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Study">Study</option>
                        <option value="Ideas">Ideas</option>
                    </select>
                </div>

                <!-- Subtasks Builder -->
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Subtasks / Checklist</label>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="subtask-input" placeholder="Add subtask step..." class="flex-1 px-3 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <button type="button" onclick="addSubtaskFromInput()" class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 px-3 py-2 rounded-xl text-sm font-medium transition-colors">Add</button>
                    </div>
                    <ul id="subtask-list" class="space-y-1.5 max-h-32 overflow-y-auto"></ul>
                </div>

                <!-- Modal Actions -->
                <div class="flex justify-end gap-3 pt-4 border-t border-gray-100 dark:border-gray-800">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 text-sm font-medium transition-colors">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium shadow-lg shadow-indigo-500/25 transition-all">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Data State
        let tasks = JSON.parse(localStorage.getItem('taskflow_tasks')) || [];
        let tempSubtasks = [];

        // UI References
        const tasksContainer = document.getElementById('tasks-container');
        const emptyState = document.getElementById('empty-state');
        const taskModal = document.getElementById('task-modal');
        const taskForm = document.getElementById('task-form');

        // Initial Load
        window.onload = function() {
            initTheme();
            renderTasks();
            lucide.createIcons();
        };

        function initTheme() {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon-light').classList.remove('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon-dark').classList.remove('hidden');
            }
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon-dark').classList.toggle('hidden', isDark);
            document.getElementById('theme-icon-light').classList.toggle('hidden', !isDark);
        });

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgClass = type === 'success' 
                ? 'bg-emerald-600 text-white' 
                : type === 'delete' ? 'bg-rose-600 text-white' : 'bg-indigo-600 text-white';

            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium transform transition-all duration-300 translate-y-[-20px] opacity-0 pointer-events-auto`;
            toast.innerHTML = `
                <i data-lucide="${type === 'success' ? 'check-circle' : type === 'delete' ? 'trash-2' : 'info'}" class="w-4 h-4"></i>
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-[-20px]', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function openModal(editId = null) {
            tempSubtasks = [];
            taskForm.reset();
            document.getElementById('task-id').value = '';
            document.getElementById('modal-title').innerText = editId ? 'Edit Task' : 'Create New Task';

            if (editId) {
                const task = tasks.find(t => t.id === editId);
                if (task) {
                    document.getElementById('task-id').value = task.id;
                    document.getElementById('form-title').value = task.title;
                    document.getElementById('form-desc').value = task.description || '';
                    document.getElementById('form-date').value = task.dueDate || '';
                    document.getElementById('form-priority').value = task.priority;
                    document.getElementById('form-category').value = task.category;
                    tempSubtasks = [...(task.subtasks || [])];
                }
            }

            renderTempSubtasks();
            taskModal.classList.remove('hidden');
        }

        function closeModal() {
            taskModal.classList.add('hidden');
        }

        function addSubtaskFromInput() {
            const input = document.getElementById('subtask-input');
            const val = input.value.trim();
            if (val) {
                tempSubtasks.push({ id: Date.now().toString(), text: val, completed: false });
                input.value = '';
                renderTempSubtasks();
            }
        }

        function removeTempSubtask(id) {
            tempSubtasks = tempSubtasks.filter(s => s.id !== id);
            renderTempSubtasks();
        }

        function renderTempSubtasks() {
            const list = document.getElementById('subtask-list');
            list.innerHTML = tempSubtasks.map(s => `
                <li class="flex items-center justify-between bg-gray-100 dark:bg-gray-800 px-3 py-1.5 rounded-lg text-xs">
                    <span class="text-gray-700 dark:text-gray-300">${escapeHtml(s.text)}</span>
                    <button type="button" onclick="removeTempSubtask('${s.id}')" class="text-rose-500 hover:text-rose-700">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                </li>
            `).join('');
            lucide.createIcons();
        }

        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('task-id').value;
            const title = document.getElementById('form-title').value.trim();
            const description = document.getElementById('form-desc').value.trim();
            const dueDate = document.getElementById('form-date').value;
            const priority = document.getElementById('form-priority').value;
            const category = document.getElementById('form-category').value;

            if (id) {
                // Update
                tasks = tasks.map(t => t.id === id ? {
                    ...t, title, description, dueDate, priority, category, subtasks: tempSubtasks
                } : t);
                showToast('Task updated successfully!');
            } else {
                // Create
                const newTask = {
                    id: Date.now().toString(),
                    title,
                    description,
                    dueDate,
                    priority,
                    category,
                    completed: false,
                    pinned: false,
                    createdAt: new Date().toISOString(),
                    subtasks: tempSubtasks
                };
                tasks.unshift(newTask);
                showToast('Task created successfully!');
            }

            saveAndRender();
            closeModal();
        });

        function saveAndRender() {
            localStorage.setItem('taskflow_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function getFilteredAndSortedTasks() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const status = document.getElementById('filter-status').value;
            const priority = document.getElementById('filter-priority').value;
            const category = document.getElementById('filter-category').value;
            const sortBy = document.getElementById('sort-by').value;

            return tasks.filter(t => {
                const matchesSearch = t.title.toLowerCase().includes(search) || (t.description && t.description.toLowerCase().includes(search));
                const matchesStatus = status === 'all' ? true : status === 'completed' ? t.completed : !t.completed;
                const matchesPriority = priority === 'all' ? true : t.priority === priority;
                const matchesCategory = category === 'all' ? true : t.category === category;
                return matchesSearch && matchesStatus && matchesPriority && matchesCategory;
            }).sort((a, b) => {
                // Always put pinned tasks first
                if (a.pinned !== b.pinned) return b.pinned ? 1 : -1;

                if (sortBy === 'dueDate') {
                    if (!a.dueDate) return 1;
                    if (!b.dueDate) return -1;
                    return new Date(a.dueDate) - new Date(b.dueDate);
                } else if (sortBy === 'priority') {
                    const weight = { High: 3, Medium: 2, Low: 1 };
                    return weight[b.priority] - weight[a.priority];
                } else {
                    return new Date(b.createdAt) - new Date(a.createdAt);
                }
            });
        }

        function renderTasks() {
            const filtered = getFilteredAndSortedTasks();
            updateStats();

            if (filtered.length === 0) {
                tasksContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            tasksContainer.innerHTML = filtered.map(task => renderTaskCard(task)).join('');
            lucide.createIcons();
        }

        function renderTaskCard(task) {
            const isCompleted = task.completed;
            const priorityBadge = {
                High: 'bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-400 border-rose-200 dark:border-rose-900',
                Medium: 'bg-amber-100 text-amber-700 dark:bg-amber-950/60 dark:text-amber-400 border-amber-200 dark:border-amber-900',
                Low: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-400 border-emerald-200 dark:border-emerald-900'
            }[task.priority];

            const categoryBadge = 'bg-indigo-50 text-indigo-700 dark:bg-indigo-950/50 dark:text-indigo-300 border-indigo-200 dark:border-indigo-800';

            const formattedDate = task.dueDate 
                ? new Date(task.dueDate).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })
                : null;

            const subtasksCount = task.subtasks ? task.subtasks.length : 0;
            const completedSubtasks = task.subtasks ? task.subtasks.filter(s => s.completed).length : 0;

            return `
                <div class="glass-card rounded-2xl p-4 sm:p-5 transition-all duration-200 border hover:shadow-md ${task.pinned ? 'ring-2 ring-indigo-500/50' : ''} ${isCompleted ? 'opacity-65' : ''}">
                    <div class="flex items-start gap-3 sm:gap-4">
                        <!-- Custom Checkbox -->
                        <button onclick="toggleTaskComplete('${task.id}')" class="mt-1 flex-shrink-0 w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-colors ${isCompleted ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-gray-300 dark:border-gray-600 hover:border-indigo-500'}">
                            ${isCompleted ? '<i data-lucide="check" class="w-4 h-4"></i>' : ''}
                        </button>

                        <!-- Task Body -->
                        <div class="flex-1 min-w-0">
                            <div class="flex flex-wrap items-center gap-2 mb-1.5">
                                <span class="text-xs px-2.5 py-0.5 rounded-full border font-semibold ${priorityBadge}">
                                    ${task.priority} Priority
                                </span>
                                <span class="text-xs px-2.5 py-0.5 rounded-full border font-medium ${categoryBadge}">
                                    ${task.category}
                                </span>
                                ${task.pinned ? `<span class="text-xs flex items-center gap-1 text-indigo-600 dark:text-indigo-400 font-semibold"><i data-lucide="pin" class="w-3 h-3"></i> Pinned</span>` : ''}
                            </div>

                            <h4 class="font-semibold text-base sm:text-lg text-gray-900 dark:text-gray-100 leading-snug ${isCompleted ? 'line-through text-gray-500 dark:text-gray-400' : ''}">
                                ${escapeHtml(task.title)}
                            </h4>

                            ${task.description ? `<p class="text-xs sm:text-sm text-gray-600 dark:text-gray-400 mt-1 line-clamp-2">${escapeHtml(task.description)}</p>` : ''}

                            <!-- Subtasks Section -->
                            ${subtasksCount > 0 ? `
                                <div class="mt-3 pt-3 border-t border-gray-100 dark:border-gray-800/60 space-y-1">
                                    <div class="flex justify-between items-center text-xs text-gray-500 mb-1">
                                        <span>Checklist</span>
                                        <span>${completedSubtasks}/${subtasksCount}</span>
                                    </div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                                        ${task.subtasks.map(sub => `
                                            <div onclick="toggleSubtask('${task.id}', '${sub.id}')" class="flex items-center gap-2 cursor-pointer p-1 rounded hover:bg-gray-100/50 dark:hover:bg-gray-800/50 text-xs text-gray-700 dark:text-gray-300">
                                                <i data-lucide="${sub.completed ? 'check-square' : 'square'}" class="w-3.5 h-3.5 ${sub.completed ? 'text-emerald-500' : 'text-gray-400'}"></i>
                                                <span class="${sub.completed ? 'line-through text-gray-400' : ''}">${escapeHtml(sub.text)}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : ''}

                            <!-- Footer Details -->
                            <div class="flex flex-wrap items-center gap-4 mt-3 text-xs text-gray-500 dark:text-gray-400">
                                ${formattedDate ? `
                                    <div class="flex items-center gap-1.5 ${new Date(task.dueDate) < new Date() && !isCompleted ? 'text-rose-500 font-semibold' : ''}">
                                        <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                                        <span>${formattedDate}</span>
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <!-- Card Action Buttons -->
                        <div class="flex items-center gap-1 sm:gap-2">
                            <button onclick="togglePin('${task.id}')" class="p-1.5 rounded-lg text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 dark:hover:bg-gray-800 transition-colors" title="${task.pinned ? 'Unpin Task' : 'Pin to top'}">
                                <i data-lucide="pin" class="w-4 h-4 ${task.pinned ? 'fill-indigo-600 text-indigo-600 dark:text-indigo-400' : ''}"></i>
                            </button>
                            <button onclick="openModal('${task.id}')" class="p-1.5 rounded-lg text-gray-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-gray-800 transition-colors" title="Edit Task">
                                <i data-lucide="edit-3" class="w-4 h-4"></i>
                            </button>
                            <button onclick="deleteTask('${task.id}')" class="p-1.5 rounded-lg text-gray-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-gray-800 transition-colors" title="Delete Task">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleTaskComplete(id) {
            tasks = tasks.map(t => {
                if (t.id === id) {
                    const completed = !t.completed;
                    showToast(completed ? 'Task completed!' : 'Task reactivated', completed ? 'success' : 'info');
                    return { ...t, completed };
                }
                return t;
            });
            saveAndRender();
        }

        function togglePin(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, pinned: !t.pinned } : t);
            saveAndRender();
        }

        function toggleSubtask(taskId, subtaskId) {
            tasks = tasks.map(t => {
                if (t.id === taskId) {
                    const subtasks = t.subtasks.map(s => s.id === subtaskId ? { ...s, completed: !s.completed } : s);
                    return { ...t, subtasks };
                }
                return t;
            });
            saveAndRender();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            showToast('Task deleted', 'delete');
            saveAndRender();
        }

        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-completed').innerText = completed;
            document.getElementById('stat-percent').innerText = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        document.getElementById('search-input').addEventListener('input', renderTasks);
        document.getElementById('filter-status').addEventListener('change', renderTasks);
        document.getElementById('filter-priority').addEventListener('change', renderTasks);
        document.getElementById('filter-category').addEventListener('change', renderTasks);
        document.getElementById('sort-by').addEventListener('change', renderTasks);

        // Helper Utility
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
