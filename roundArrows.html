<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can You Obey The Arrows? - Particle Optical Illusion</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
        }

        /* Header and Arrows */
        .header {
            text-align: center;
            margin-top: 20px;
            z-index: 10;
        }
        .header h1 {
            font-size: 22px;
            letter-spacing: 3px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .arrows {
            display: flex;
            justify-content: center;
            gap: 180px;
            font-size: 32px;
        }
        .arrow-left { color: #4fc3f7; }  /* Blue Arrow */
        .arrow-right { color: #e53935; } /* Red Arrow */

        /* 3D Canvas Container */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Footer and Instructions */
        .footer {
            text-align: center;
            margin-bottom: 30px;
            z-index: 10;
        }
        .labels {
            display: flex;
            justify-content: space-around;
            width: 320px;
            margin: 0 auto 12px auto;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 14px;
            color: #ccc;
        }
        .instructions {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .instructions span {
            color: #ff5722;
        }
        .sub-instruction {
            font-size: 13px;
            color: #aaa;
            letter-spacing: 0.5px;
        }
        .watermark {
            font-size: 11px;
            color: #555;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <h1>CAN YOU OBEY THE ARROWS?</h1>
        <div class="arrows">
            <span class="arrow-left">◄</span>
            <span class="arrow-right">►</span>
        </div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Footer / Instructions Section -->
    <div class="footer">
        <div class="labels">
            <span>LEFT</span>
            <span>RIGHT</span>
        </div>
        <div class="instructions">Make each one spin the way its <span>ARROW</span> points</div>
        <div class="sub-instruction">front side moves where the arrow points</div>
        <div class="watermark">@QODEXA-9</div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Scene, Camera, and Renderer Setup
        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5.5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 2. Function to Create Custom Colored Particle Spheres
        function createColorParticleSphere() {
            const geometry = new THREE.SphereGeometry(1.6, 50, 50);
            
            const count = geometry.attributes.position.count;
            const colors = new Float32Array(count * 3);

            // Define sphere gradient colors matching the video
            const colorTop = new THREE.Color(0x8be9fd);    // Cyan/Blue top
            const colorBottom = new THREE.Color(0xff79c6); // Pink/Red bottom
            const colorMid = new THREE.Color(0xf1fa8c);    // Yellowish mid tint

            const pos = geometry.attributes.position;
            for (let i = 0; i < count; i++) {
                const y = pos.getY(i);
                let mixedColor = colorTop.clone();
                if (y < 0) {
                    mixedColor.lerp(colorBottom, Math.abs(y) / 1.6);
                } else {
                    mixedColor.lerp(colorMid, y / 1.6);
                }

                colors[i * 3] = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Particle material settings
            const material = new THREE.PointsMaterial({
                size: 0.035,
                vertexColors: true,
                transparent: true,
                opacity: 0.85
            });

            return new THREE.Points(geometry, material);
        }

        // Create Left and Right Spheres
        const sphereLeft = createColorParticleSphere();
        const sphereRight = createColorParticleSphere();

        // Position spheres side-by-side
        const xOffset = 1.9;
        sphereLeft.position.x = -xOffset;
        sphereRight.position.x = xOffset;

        scene.add(sphereLeft);
        scene.add(sphereRight);

        // 3. Animation Loop (Rotation Control)
        function animate() {
            requestAnimationFrame(animate);

            // Left sphere spins counter-clockwise / towards left arrow
            sphereLeft.rotation.y -= 0.012;
            sphereLeft.rotation.x += 0.002;

            // Right sphere spins clockwise / towards right arrow
            sphereRight.rotation.y += 0.012;
            sphereRight.rotation.x += 0.002;

            renderer.render(scene, camera);
        }
        animate();

        // 4. Responsive Window Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
